<fieldset class="compose-layout"><legend>Page layout · live after Generate preview</legend>
<div class="layout-fields">
<label>Top margin (mm) <input id="compose-margin-top" type="number" min="20" max="60" step="1" value="20" required></label>
<label>Bottom margin (mm) <input id="compose-margin-bottom" type="number" min="20" max="60" step="1" value="20" required></label>
<label>Left margin (mm) <input id="compose-margin-left" type="number" min="20" max="60" step="1" value="20" required></label>
<label>Right margin (mm) <input id="compose-margin-right" type="number" min="20" max="60" step="1" value="20" required></label>
<label>Alignment <select id="compose-alignment"><option value="left">Left</option><option value="centre">Centre</option><option value="right">Right</option></select></label>
<label>Extra paragraph gap (mm) <input id="compose-paragraph-gap" type="number" min="0" max="30" step="1" value="0" required></label>
</div>
<button id="compose-layout-reset" type="button">Reset page layout</button>
<p>Leave a blank line between paragraphs. Extra paragraph gap adds space after that blank line. Margins keep at least 20 mm clear for the verified A4 setup. Longer writing continues onto new pages automatically, up to 20 pages.</p>
</fieldset>
