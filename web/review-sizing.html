<fieldset class="sample-sizing"><legend>Adjust this letter’s size</legend><label for="sample-size">Letter size <output id="sample-size-value">100%</output></label><input id="sample-size" type="range" min="50" max="200" step="any" value="100"><button id="sample-size-reset" type="button">Original size</button><p class="subtle">Scales height and width together around the original baseline. Save changes to use this size in blends, My alphabet and Compose. Original strokes are kept.</p><label for="review-word">Try a short word</label><input id="review-word" type="text" maxlength="40" value="" spellcheck="false"><p id="review-word-status" class="subtle" role="status"></p><div id="review-word-preview" role="img" aria-label="Word preview with the pending letter adjustment"></div></fieldset>
