<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handwriting Studio · My alphabet</title><link rel="stylesheet" href="/static/style.css?v=16"><style>
html{height:100%;overflow-x:hidden;overflow-y:scroll;scrollbar-gutter:stable}body{min-height:100%;height:auto;overflow:visible}.alphabet-shell{max-width:1100px;margin:auto;padding:20px}header,nav,.alphabet-controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.alphabet-controls{margin:16px 0}select{font:inherit;padding:10px;max-width:100%}p{line-height:1.5}#alphabet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}#alphabet-grid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px}#alphabet-grid button[aria-pressed="true"]{outline:3px solid #245e4b}#alphabet-grid img{width:100%;height:100px;object-fit:contain;background:white}#alphabet-grid small{font-size:.8rem;line-height:1.4}#alphabet-detail{margin-top:24px}#alphabet-samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}#alphabet-samples article{border:1px solid #bccbc1;border-radius:10px;background:white;padding:12px}#alphabet-samples img{display:block;width:100%;height:180px;object-fit:contain}.preferred-sample{outline:2px solid #245e4b}#alphabet-status{min-height:1.5em}button:focus-visible{outline:3px solid #245e4b;outline-offset:2px}
</style></head><body><div class="alphabet-shell"><header><h1>My alphabet</h1><nav><a class="button" href="/">Capture</a><a class="button" href="/review">Review samples</a><a class="button" href="/blending">Blend a character</a><a id="alphabet-compose" class="button" href="/compose">Compose</a></nav></header>
<p>See which characters have saved blends and choose a preferred version of each. Preferences apply in Compose when enabled, within the source type you select.</p>
<div class="alphabet-controls"><label>Writer <select id="alphabet-writer"></select></label><label>Group <select id="alphabet-kind"><option value="lowercase">Lowercase a–z</option><option value="uppercase">Capitals A–Z</option><option value="numbers">Numbers</option><option value="symbols">Punctuation and symbols</option><option value="pairs">Joined pairs</option></select></label><button id="alphabet-refresh">Refresh</button></div>
<p id="alphabet-summary"></p><p id="alphabet-gaps"></p><p id="alphabet-status" role="status" aria-live="polite">Loading your alphabet…</p><div id="alphabet-grid" role="group" aria-label="Choose a character"></div>
<section id="alphabet-detail" aria-labelledby="alphabet-heading"><h2 id="alphabet-heading">Character samples</h2><p id="alphabet-choice"></p><button id="alphabet-clear" disabled>Clear preferred version</button><div id="alphabet-samples"></div></section></div><script src="assets/alphabet.js"></script></body></html>
