name: Publish PR 6 preview
on:
  push:
    branches: [feature/cursive-milestone-1]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Checkout live main
        uses: actions/checkout@v4
        with:
          ref: main
          path: live-main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build preview
        run: |
          python3 -m pip install -r requirements.txt
          npm ci --ignore-scripts
          python3 scripts/build_pages.py
      - name: Build current live main
        working-directory: live-main
        run: |
          npm ci --ignore-scripts
          python3 scripts/build_pages.py
      - name: Assemble live root and preview subfolder
        run: |
          mkdir -p combined/pr-preview/pr-6
          cp -R live-main/docs/. combined/
          cp -R docs/. combined/pr-preview/pr-6/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy combined live site and PR preview
        id: deployment
        uses: actions/deploy-pages@v4
